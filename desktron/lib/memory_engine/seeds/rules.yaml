# desk 工作层内容规则(curator 的 add / lint 读)。表达黑名单对齐用户表达约束:陈述结论不讲过程、不浮夸。
# emoji 禁令不在此(curator 的 check_body 只做字面匹配),由 mem 命令封装层预检。

required_fields: [id, tier, kind, confidence, summary]
required_fields_fact: [doc_type, status]

# 置信度伴随字段:两档都需 source。档位由 source 里的独立来源数决定(0/1/≥2),不手设。
require_companion:
  documented: [source]
  corroborated: [source]

# 内建抽取(URL / UUID / file:line / commit)认不出时的兜底形态,命中只算一个来源。
# 整列覆盖 curator 默认:前三条是默认(url / file:line / commit),其余补 desk 的可核源渠道。
# 与 knowledge/rules.yaml 同一套,记忆与知识置信度判据一致。
source_patterns:
  - 'https?://'                          # URL(文档 / 代码仓 / 工单)
  - '\S+\.\w{1,8}:\d+'                   # file.ext:line(代码 / 配置定位)
  - '\b[0-9a-f]{7,40}\b'                 # commit hash
  - '(?:cache/)?deepwiki/[\w./-]+'       # deepwiki 缓存引用
  - '\bet al\.'                          # 论文引用(书名号形态已由内建抽取认走)
  - '\((?:19|20)\d{2}\)'                # (出版年份)

# 正文禁用表达(字面匹配):维护者视角 / 推理过程 / 浮夸营销
forbidden_in_body:
  - 当前理解是
  - 之所以
  - 本文档主要介绍
  - 本文解决
  - 后续计划补充
  - 经过分析
  - 我们发现
  - 通过对比
  - 可以发现
  - 由此可见
  - 目前看来
  - 整理后发现
  - 杀手锏
  - 革命性
  - 颠覆
  - 至关重要
  - 本质上
  - 最关键

freshness_default: {fresh: 6, aging: 12}
