[package]
name = "desktron-windows"
version = "0.1.0"
description = "Desktron Windows 原生壳：WebView2 工作台、后端 Supervisor 与内置浏览器"
edition = "2021"
publish = false

[[bin]]
name = "Desktron"
path = "src/main.rs"

[dependencies]
tao = "0.37"
wry = { version = "0.57", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
webview2-com = "0.39"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_JobObjects",
  "Win32_System_Power",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Com",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
  "Win32_UI_Controls",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
] }
rfd = { version = "0.17", default-features = false, features = ["common-controls-v6"] }
tauri-winrt-notification = "0.8"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
strip = true
